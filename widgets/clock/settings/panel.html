<fieldset>
  <legend>표시</legend>
  <label class="check"><input id="clockShowSeconds" type="checkbox" /> 초 표시</label>

  <label class="check"><input id="clockAlwaysOnTop" type="checkbox" /> 항상 위에 표시</label>
